<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--navy:#062b58;--navy2:#001e42;--gold:#e8b949;--pale:#edf5fc;--ink:#062652}
  *{box-sizing:border-box} html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
  body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:var(--ink)}
  #poster{width:1080px;height:1920px;background:#fff;overflow:hidden;position:relative}
  .hero{height:520px;position:relative;overflow:hidden;background:#fff}
  .hero-photo{position:absolute;right:0;top:0;width:58%;height:100%;object-fit:cover;clip-path:polygon(28% 0,100% 0,100% 100%,0 100%)}
  .gold-cut{position:absolute;right:47%;top:-80px;width:54px;height:700px;background:var(--gold);transform:rotate(-24deg);z-index:2}
  .brand-window{position:absolute;z-index:3;left:46px;top:26px;width:370px;height:138px;overflow:hidden}
  .brand{width:370px;height:138px;object-fit:contain;object-position:left top}
  .hero-copy{position:absolute;z-index:3;left:45px;top:178px;width:575px}
  .headline{font-size:48px;line-height:.98;font-weight:900;text-transform:uppercase;letter-spacing:-1.5px;max-width:560px}
  .country{display:inline-block;margin-top:15px;padding:9px 22px;border-radius:14px;background:var(--gold);font-size:33px;font-weight:900;text-transform:uppercase}
  .status{display:flex;gap:22px;margin-top:24px;font-weight:800;font-size:20px}.status span{background:#f4f7fa;border-radius:12px;padding:12px 18px}
  .roles{padding:0 25px;margin-top:-1px;display:grid;gap:12px}
  .roles.count-1{grid-template-columns:1fr}.roles.count-2,.roles.count-4{grid-template-columns:1fr 1fr}
  .role{background:linear-gradient(120deg,var(--navy),var(--navy2));border-radius:22px;color:#fff;padding:24px 28px;min-height:270px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid #fff}
  .count-1 .role{min-height:360px}.count-4 .role{min-height:245px;padding:20px 22px}
  .role-top{display:flex;justify-content:space-between;gap:20px;align-items:start}
  .role-title{font-size:49px;line-height:1.02;font-weight:900;text-transform:uppercase}.count-4 .role-title{font-size:34px}.count-2 .role-title{font-size:41px}
  .vacancies{text-align:right;color:var(--gold);font-weight:900;font-size:22px;min-width:145px}.vacancies small{display:block;color:#fff;font-size:15px}
  .salary{margin-top:20px;background:linear-gradient(105deg,#ffdf83,var(--gold));border-radius:18px;color:var(--navy2);padding:17px 20px}
  .salary-local{font-size:36px;font-weight:900;line-height:1.05}.count-4 .salary-local{font-size:27px}.count-2 .salary-local{font-size:31px}
  .salary-inr{margin-top:8px;background:var(--navy);color:#fff;border-radius:12px;padding:9px 12px;font-size:25px;font-weight:900}.count-4 .salary-inr{font-size:19px}.count-2 .salary-inr{font-size:22px}
  .facts{padding:18px 28px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fact{background:linear-gradient(100deg,#f4f8fc,#e5f1fb);border-radius:18px;padding:16px 20px;min-height:108px;display:flex;align-items:center;gap:16px}
  .fact-icon{width:58px;height:58px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;flex:0 0 auto}
  .fact-label{font-weight:900;font-size:18px}.fact-value{margin-top:4px;font-size:20px;line-height:1.18}
  .footer{position:absolute;left:28px;right:28px;bottom:24px;height:70px;border-radius:18px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;letter-spacing:1px}
  .count-4 + .facts .fact{min-height:92px}
</style>
</head>
<body>
<main id="poster"></main>
<script>
const data=__POSTER_DATA__;
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const role=r=>`<section class="role"><div class="role-top"><div class="role-title">${esc(r.title)}</div>${r.vacancies?`<div class="vacancies">${esc(r.vacancies)}<small>VACANCIES</small></div>`:""}</div><div class="salary"><div class="salary-local">${esc(r.localSalary)}</div><div class="salary-inr">Approx. INR ${esc(r.inrSalary)}</div></div></section>`;
const fact=f=>`<div class="fact"><div class="fact-icon">${esc(f.icon)}</div><div><div class="fact-label">${esc(f.label)}</div><div class="fact-value">${esc(f.value)}</div></div></div>`;
document.querySelector("#poster").innerHTML=`
 <header class="hero"><img class="hero-photo" crossorigin="anonymous" src="${esc(data.heroImageUrl)}"><div class="gold-cut"></div><div class="brand-window"><img class="brand" src="${esc(data.logoUrl)}"></div><div class="hero-copy"><div class="headline">${esc(data.headline)}</div><div class="country">${esc(data.country)}</div><div class="status"><span>Order Code: ${esc(data.orderCode||"—")}</span><span>Status: ${esc(data.status)}</span></div></div></header>
 <div class="roles count-${data.roles.length}">${data.roles.map(role).join("")}</div>
 <div class="facts">${data.facts.map(fact).join("")}</div>
 <footer class="footer">ANCHOR ABROAD • GUIDING DREAMS. BUILDING FUTURES.</footer>`;
</script>
</body>
</html>
