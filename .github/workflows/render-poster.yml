name: Render Anchor Abroad Poster
on:
  repository_dispatch:
    types: [poster_render]
  workflow_dispatch:
    inputs:
      poster_json_base64:
        description: Base64 encoded poster JSON
        required: true
      request_id:
        description: Request identifier used for the artifact name
        required: false
        default: manual
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Render poster
        env:
          POSTER_JSON_BASE64: ${{ github.event.client_payload.poster_json_base64 || inputs.poster_json_base64 }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p output
          echo "$POSTER_JSON_BASE64" | base64 --decode > output/input.json
          node scripts/render.js output/input.json output/poster.png
      - uses: actions/upload-artifact@v4
        with:
          name: poster-${{ github.event.client_payload.request_id || inputs.request_id }}
          path: output/poster.png
          retention-days: 1
